name: CardWatch Email Bridge

on:
  schedule:
    # Runs every 5 minutes - this is GitHub's actual minimum interval for
    # scheduled workflows (anything faster isn't supported, regardless of
    # what the cron syntax itself would allow).
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Test mode: check ALL unread emails, not just CardWatch (for testing the pipeline)"
        type: boolean
        default: false

jobs:
  check-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run email bridge
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_MODE: ${{ inputs.test_mode }}
        run: python cardwatch_bridge.py
